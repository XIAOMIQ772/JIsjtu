[package]
name = "agent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-openai = {version = "0.41.0",features = ["chat-completion"]}
dotenvy = "0.15.7"
schemars = "1.2.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls", "multipart"] }
regex = "1"
mime_guess = "2"
webbrowser = "1"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
imap = "2.4"
native-tls = "0.2"
mail-parser = { version = "0.11", features = ["encoding_rs", "full_encoding"] }
chrono = "0.4"
flate2 = "1"
ratatui = "0.30.2"
crossterm = "0.29.0"
futures-util = "0.3.34"
tokio-tungstenite = "0.29.0"
unicode-width = "0.2.2"
tempfile = "3.27"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
base64 = "0.22.1"
jpeg-encoder = "0.6"
pdfium-render = { version = "=0.9.6", default-features = false, features = ["pdfium_8125", "thread_safe"] }
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_System_WinRT"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
pdf-extract = "0.7"

[build-dependencies]
cc = "1"
