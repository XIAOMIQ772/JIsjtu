[package]
name = "agent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-openai = {version = "0.41.0",features = ["chat-completion"]}
dotenvy = "0.15.7"
schemars = "1.2.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls"] }
webbrowser = "1"
pdf-extract = "0.7"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
imap = "2.4"
native-tls = "0.2"
mail-parser = { version = "0.11", features = ["encoding_rs", "full_encoding"] }

